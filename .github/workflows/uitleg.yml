name: Hamerslag uitleg achteraf

# Eenmalig: oude zittingen alsnog een uitleg in gewone taal geven (waarom + verwachting).
on:
  workflow_dispatch:

jobs:
  uitleg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uitleg schrijven voor oude zittingen
        working-directory: engine
        run: node uitleg-achteraf.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODEL_HAIKU: ${{ vars.MODEL_HAIKU }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
