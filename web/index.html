<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB">
<title>Hamerslag</title>
<meta name="description" content="Tien AI-traders debatteren. Eén hamer beslist.">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Hamerslag">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" aria-hidden="true">
      <div><h1>Hamerslag</h1><small id="sub">10 AI-traders · nepgeld</small></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="demoTag" class="demo-tag" hidden>DEMO</span>
      <span class="pill"><span class="dot"></span><span id="status">Laden…</span></span>
    </div>
  </header>

  <div id="breaking"></div>

  <section class="view" id="v-home"></section>
  <section class="view" id="v-markt"></section>
  <section class="view" id="v-portefeuille"></section>
  <section class="view" id="v-traders"></section>
  <section class="view" id="v-bronnen"></section>
</div>

<div id="zaal3d">
  <div class="hud">
    <a class="iconbtn" href="#home" aria-label="Terug naar home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div class="mid"><b>De zaal</b><span id="zaalSub">laden…</span></div>
    <span class="pill" id="zaalLive"><span class="dot red"></span>LIVE</span>
  </div>
  <div class="cams" role="group" aria-label="Camerastandpunt">
    <button type="button" data-cam="stoel" class="on">Mijn stoel</button>
    <button type="button" data-cam="overzicht">Overzicht</button>
    <button type="button" data-cam="voorzitter">Voorzitter</button>
    <button type="button" data-cam="spreker">Volg spreker</button>
    <button type="button" data-cam="hokjes">Stemhokjes</button>
  </div>
  <div class="screenstat" id="dragHint">Sleep om rond te kijken · knijp om te zoomen</div>
  <div class="ctrl">
    <button class="iconbtn" id="btnReplay" aria-label="Debat opnieuw afspelen" title="Opnieuw afspelen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </div>
  <div id="bubble3d" class="bubble bubble3d" hidden></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="hd"><span class="eyebrow" id="sheetTitle">Debat</span><span class="mut" id="sheetCount" style="font-size:12px"></span></div>
    <div class="list" id="transcript"></div>
  </div>
</div>

<div class="popover" id="popover" role="dialog" aria-live="polite"></div>

<nav class="tabs" aria-label="Navigatie">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a>
  <a href="#markt" data-tab="markt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>Markt</a>
  <a href="#zaal" data-tab="zaal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20a9 9 0 0 1 18 0"/><path d="M7 20a5 5 0 0 1 10 0"/><circle cx="12" cy="6" r="2"/></svg>Zaal</a>
  <a href="#portefeuille" data-tab="portefeuille"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/><path d="M3 10h18"/></svg>Portefeuille</a>
  <a href="#traders" data-tab="traders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/></svg>Traders</a>
  <a href="#bronnen" data-tab="bronnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a7 7 0 0 1 14 0"/><path d="M8.5 12.5a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="16" r="1.6"/><path d="M12 17.6V21"/></svg>Bronnen</a>
</nav>

<div id="login" class="login" hidden>
  <form id="loginForm">
    <div class="brand" style="margin-bottom:6px"><img class="logo" src="icon.svg" alt=""><div><h1>Hamerslag</h1><small>Log in om je zaal te openen</small></div></div>
    <label for="em">E-mail</label><input id="em" type="email" autocomplete="email" required>
    <label for="pw">Wachtwoord</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Inloggen</button>
    <span id="loginErr" class="dn" style="font-size:13px"></span>
  </form>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
