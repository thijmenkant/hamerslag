<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2470"/>
      <stop offset=".55" stop-color="#16133F"/>
      <stop offset="1" stop-color="#0B0A24"/>
    </linearGradient>
    <radialGradient id="gloed" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 330) scale(220)">
      <stop offset="0" stop-color="#FBBF24" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#F59E0B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset=".35" stop-color="#FBBF24"/>
      <stop offset=".75" stop-color="#D97706"/>
      <stop offset="1" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#5B2A06"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset=".5" stop-color="#D97706"/>
      <stop offset="1" stop-color="#7C3A0A"/>
    </linearGradient>
    <linearGradient id="blok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="blokvoet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="lijn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".9"/>
    </linearGradient>
    <filter id="schaduw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="vorm"><rect width="512" height="512"/></clipPath>
  </defs>

  <g clip-path="url(#vorm)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- zaal: tien zetels in een boog -->
    <g fill="#A5B4FC" opacity=".22">
      <circle cx="74" cy="214" r="9"/><circle cx="92" cy="160" r="9"/><circle cx="126" cy="114" r="9"/><circle cx="172" cy="82" r="9"/><circle cx="226" cy="66" r="9"/>
      <circle cx="286" cy="66" r="9"/><circle cx="340" cy="82" r="9"/><circle cx="386" cy="114" r="9"/><circle cx="420" cy="160" r="9"/><circle cx="438" cy="214" r="9"/>
    </g>
    <!-- stijgende koerslijn -->
    <polyline points="20,452 96,398 150,420 222,330 286,356 362,246 420,264 500,150" fill="none" stroke="url(#lijn)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="500" cy="150" r="0"/>
    <rect width="512" height="512" fill="url(#gloed)"/>
  </g>

  <g transform="translate(256 256) scale(.76) translate(-256 -256)"><!-- slagblok -->
  <g filter="url(#schaduw)">
    <rect x="118" y="352" width="196" height="46" rx="16" fill="url(#blokvoet)"/>
    <rect x="138" y="330" width="156" height="34" rx="12" fill="url(#blok)"/>
    <rect x="148" y="334" width="136" height="6" rx="3" fill="#fff" opacity=".35"/>
  </g>

  <!-- inslag -->
  <g stroke="#FDE68A" stroke-width="11" stroke-linecap="round">
    <line x1="156" y1="300" x2="122" y2="282"/>
    <line x1="166" y1="270" x2="146" y2="238"/>
    <line x1="140" y1="324" x2="102" y2="322"/>
  </g>

  <!-- hamer, iets gekanteld, net op het blok -->
  <g filter="url(#schaduw)" transform="translate(290 234) rotate(-30)">
    <rect x="-13" y="44" width="26" height="206" rx="13" fill="url(#steel)"/>
    <rect x="-17" y="226" width="34" height="34" rx="12" fill="#92400E"/>
    <rect x="-110" y="-50" width="220" height="100" rx="26" fill="url(#kop)"/>
    <rect x="-90" y="-50" width="20" height="100" fill="url(#band)"/>
    <rect x="70" y="-50" width="20" height="100" fill="url(#band)"/>
    <rect x="-18" y="-50" width="36" height="100" fill="url(#band)" opacity=".55"/>
    <rect x="-100" y="-40" width="200" height="12" rx="6" fill="#FFFBEB" opacity=".55"/>
  </g>
</g></svg>
